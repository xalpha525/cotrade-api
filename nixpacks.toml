[phases.setup]
nixPkgs = ["nodejs_22", "pnpm"]

[phases.install]
cmds = ["pnpm install --frozen-lockfile --ignore-scripts"]

[phases.build]
cmds = [
  "pnpm --filter @copytrading/config build 2>/dev/null || pnpm --filter @copytrading/config tsc 2>/dev/null || true",
  "pnpm --filter @copytrading/types build 2>/dev/null || pnpm --filter @copytrading/types tsc 2>/dev/null || true",
  "pnpm --filter @copytrading/logger build 2>/dev/null || pnpm --filter @copytrading/logger tsc 2>/dev/null || true",
  "pnpm --filter @copytrading/utils build 2>/dev/null || pnpm --filter @copytrading/utils tsc 2>/dev/null || true",
  "pnpm --filter @copytrading/db build 2>/dev/null || pnpm --filter @copytrading/db tsc 2>/dev/null || true",
  "pnpm --filter @copytrading/auth build 2>/dev/null || pnpm --filter @copytrading/auth tsc 2>/dev/null || true",
  "pnpm --filter @copytrading/redis build 2>/dev/null || pnpm --filter @copytrading/redis tsc 2>/dev/null || true",
  "pnpm --filter @copytrading/events build 2>/dev/null || pnpm --filter @copytrading/events tsc 2>/dev/null || true",
  "pnpm --filter @copytrading/queue build 2>/dev/null || pnpm --filter @copytrading/queue tsc 2>/dev/null || true",
  "pnpm --filter @copytrading/blockchain build 2>/dev/null || pnpm --filter @copytrading/blockchain tsc 2>/dev/null || true",
  "pnpm --filter @copytrading/api-client build 2>/dev/null || pnpm --filter @copytrading/api-client tsc 2>/dev/null || true",
  "pnpm --filter @copytrading/api build"
]

[start]
cmd = "node apps/api/dist/index.js"
