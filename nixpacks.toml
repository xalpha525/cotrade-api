[phases.setup]
nixPkgs = ["nodejs_22"]

[phases.install]
cmds = [
  "npm install -g pnpm@9.0.0",
  "pnpm install --frozen-lockfile"
]

[phases.build]
cmds = [
  "pnpm --filter @copytrading/config build 2>/dev/null || true",
  "pnpm --filter @copytrading/types build 2>/dev/null || true",
  "pnpm --filter @copytrading/logger build 2>/dev/null || true",
  "pnpm --filter @copytrading/utils build 2>/dev/null || true",
  "pnpm --filter @copytrading/db build 2>/dev/null || true",
  "pnpm --filter @copytrading/auth build 2>/dev/null || true",
  "pnpm --filter @copytrading/redis build 2>/dev/null || true",
  "pnpm --filter @copytrading/events build 2>/dev/null || true",
  "pnpm --filter @copytrading/queue build 2>/dev/null || true",
  "pnpm --filter @copytrading/blockchain build 2>/dev/null || true",
  "pnpm --filter @copytrading/api-client build 2>/dev/null || true",
  "pnpm --filter @copytrading/api build"
]

[start]
cmd = "node apps/api/dist/index.js"
